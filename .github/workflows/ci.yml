name: CI

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: Python + Pillow (Sprite-Audit)
        run: pip install pillow

      - name: Build-Artefakt ist aktuell (index.html ↔ src/)
        run: |
          npm run build
          git diff --exit-code -- index.html

      - name: Sprite-Drift-Check (Audit + Embed-Idempotenz)
        run: |
          python tools/sprite_audit.py
          node tools/embed_char_sprites.js
          git diff --exit-code -- src/

      - name: Selftest (headless Chromium)
        run: npm test

      - name: Performance-Regressionstest (P99 Render-Zeit, Alarm > 5 ms)
        run: npm run perf
        env:
          PERF_THRESHOLD_MS: "5"
          PERF_FRAMES: "240"

      - name: Blender-Smoke (GLB-Validierung)
        run: npm run blender:smoke

      - name: Artefakte bei Fehlschlag hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
